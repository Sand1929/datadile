[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datadile"
version = "0.1.0"
description = "YAML-defined data tests for SQL query results"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Your Name", email = "you@example.com" },
]
keywords = []
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg2-binary",
    "sqlparse>=0.4",
    "rank-bm25>=0.2",
    "httpx",
    "rich",
    "prompt_toolkit",
    "PyYAML>=6.0",
]

[project.scripts]
datadile = "datadile:main"

[project.urls]
Homepage = "https://github.com/yourname/datadile"

[tool.hatch.build.targets.wheel]
packages = ["datadile"]

[tool.hatch.build.targets.wheel.force-include]
"datadile/skill/SKILL.md" = "datadile/skill/SKILL.md"

[tool.hatch.build.targets.sdist]
include = [
    "/datadile",
    "/README.md",
    "/pyproject.toml",
    "/datadile.yaml.example",
]
