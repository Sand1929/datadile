[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datadile"
version = "0.1.0"
description = "YAML-defined data tests for SQL query results"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Sandy Suh", email = "sandy@parsagon.io" },
]
keywords = []
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg2-binary",
    "sqlparse>=0.4",
    "sqlglot>=25.0",
    "rank-bm25>=0.2",
    "httpx",
    "rich",
    "prompt_toolkit",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
datadile = "datadile:main"

[project.urls]
Homepage = "https://github.com/Sand1929/datadile"
Repository = "https://github.com/Sand1929/datadile"

[tool.hatch.build.targets.wheel]
packages = ["datadile"]

[tool.hatch.build.targets.wheel.force-include]
"datadile/skill/SKILL.md" = "datadile/skill/SKILL.md"

[tool.hatch.build.targets.sdist]
include = [
    "/datadile",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
    "/datadile.yaml.example",
]
